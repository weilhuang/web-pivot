<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title id="title">Web Pivot</title>
</head>
<body>
<div class="app">
    <header class="header">
        <img class="logo" src="icons/web-pivot-logo-48.png" alt="">
        <div class="header-copy">
            <h1 data-i18n="title">Web Pivot</h1>
            <p class="subtitle" data-i18n="subtitle">Compare selections from two pages</p>
        </div>
    </header>

    <div id="banner" class="banner" hidden role="status" aria-live="polite"></div>

    <section class="slots" aria-label="Selections">
        <article class="slot" id="slot1" data-slot="1" data-state="empty">
            <div class="slot-head">
                <span class="slot-index" aria-hidden="true">1</span>
                <div class="slot-meta">
                    <h2 data-i18n="contentLabel1">Content 1</h2>
                    <span class="chip" id="chip1">Empty</span>
                </div>
            </div>
            <p class="preview" id="preview1">Pick an element on the current page.</p>
            <p class="source" id="source1" hidden></p>
            <button type="button" class="btn btn-secondary" id="selectContent1">Select</button>
        </article>

        <article class="slot" id="slot2" data-slot="2" data-state="empty">
            <div class="slot-head">
                <span class="slot-index" aria-hidden="true">2</span>
                <div class="slot-meta">
                    <h2 data-i18n="contentLabel2">Content 2</h2>
                    <span class="chip" id="chip2">Empty</span>
                </div>
            </div>
            <p class="preview" id="preview2">Pick an element on the current page.</p>
            <p class="source" id="source2" hidden></p>
            <button type="button" class="btn btn-secondary" id="selectContent2">Select</button>
        </article>
    </section>

    <footer class="actions">
        <button type="button" class="btn btn-ghost" id="clearContent">Clear</button>
        <button type="button" class="btn btn-primary" id="compareContent">Compare</button>
    </footer>
</div>
<script src="libs/diff_match_patch.js"></script>
<script src="libs/htmldiff.js"></script>
<script src="popup.js"></script>
</body>
</html>
